<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏴‍☠️ SUMMIT CLUB — โซน 2</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c8920a;
  --gold-light: #e8a820;
  --gold-dark: #8B5E00;
  --cream: #f5ead0;
  --cream2: #fdf3dc;
  --brown: #3a1a00;
  --brown-mid: #7a3e00;
  --red: #8B1a00;
  --red-mid: #cc3300;
  --parchment: #fffaf0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Cinzel', serif;
  background: var(--cream);
  color: var(--brown);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── SETUP / SUMMARY screens ─── */
#setup-screen, #summary-screen {
  min-height: 100vh;
  background: var(--cream);
  background-image:
    radial-gradient(ellipse at 15% 10%, #ffe8a0 0%, transparent 45%),
    radial-gradient(ellipse at 85% 90%, #f0d49a 0%, transparent 45%),
    url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23c8920a' fill-opacity='0.05'%3E%3Cpath d='M20 20v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM4 4V0H2v4H0v2h2v4h2V6h4V4H4z'/%3E%3C/g%3E%3C/svg%3E");
}

.scroll-wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 80px; }

.s-header { text-align: center; padding: 36px 16px 22px; }
.s-header-icon { font-size: 52px; display: block; animation: floatY 3s ease-in-out infinite; }
@keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
.s-header h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(22px, 4vw, 36px);
  letter-spacing: 5px; color: var(--brown-mid);
  text-shadow: 1px 2px 0 rgba(255,200,80,.5);
  margin-top: 10px;
}
.s-header p { color: #a07040; font-size: 11px; letter-spacing: 4px; margin-top: 8px; }

.panel {
  background: linear-gradient(160deg, var(--parchment), var(--cream2));
  border: 2px solid var(--gold);
  border-radius: 16px; padding: 22px;
  box-shadow: 0 6px 28px rgba(120,60,0,.14);
  position: relative; margin-bottom: 14px;
}
.panel::before {
  content: ''; position: absolute; inset: 7px;
  border: 1px solid rgba(200,146,10,.22);
  border-radius: 10px; pointer-events: none;
}
.sec-label {
  font-size: 10px; letter-spacing: 4px; color: #9a6010;
  text-transform: uppercase; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.sec-label::after { content:''; flex:1; height:1px; background: linear-gradient(90deg,#c8920a55,transparent); }

.tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(200,146,10,.1); border: 1px solid #c8920a88;
  padding: 5px 11px; border-radius: 20px; font-size: 13px; color: #7a4000;
}
.tag.dt { background: rgba(180,60,0,.08); border-color: #cc440088; color: #8B2000; }
.tag .del { background: none; border: none; color: #c07030; cursor: pointer; font-size: 16px; line-height: 1; padding: 0; }
.tag .del:hover { color: #cc2200; }

.inp-row { display: flex; gap: 10px; }
.inp-row input, .txt-inp {
  flex: 1; background: #fffdf5; border: 1px solid #c8920a88;
  color: var(--brown); padding: 10px 14px; border-radius: 8px;
  font-family: 'Georgia', serif; font-size: 14px; outline: none;
  transition: border-color .2s;
}
.inp-row input:focus, .txt-inp:focus { border-color: var(--gold); }
.inp-row input::placeholder, .txt-inp::placeholder { color: #c8a870; }

.player-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 12px; }
.player-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: rgba(200,146,10,.06); border: 1px solid #c8920a55;
  border-radius: 10px; padding: 10px 14px;
}
.p-num { font-family:'Cinzel Decorative',serif; font-size: 18px; color: var(--gold); min-width: 24px; text-align: center; }
.p-name {
  flex: 1; min-width: 110px; background: #fffdf5;
  border: 1px solid #c8920a66; color: var(--brown);
  padding: 8px 12px; border-radius: 7px;
  font-family: 'Georgia', serif; font-size: 14px; outline: none;
}
.p-name:focus { border-color: var(--gold); }
.draws-ctrl { display: flex; align-items: center; gap: 7px; }
.draws-lbl { font-size: 10px; letter-spacing: 2px; color: #9a6010; white-space: nowrap; }
.mini-btn {
  width: 28px; height: 28px; border: none; border-radius: 6px;
  background: linear-gradient(145deg, #a06800, var(--gold-light));
  color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(160,100,0,.25); transition: all .15s;
}
.mini-btn:hover { transform: translateY(-1px); }
.mini-btn.red { background: linear-gradient(145deg, var(--red), var(--red-mid)); }
.draws-num { font-family:'Cinzel Decorative',serif; font-size: 20px; color: #8B4A00; min-width: 24px; text-align: center; }
.del-p { background: none; border: none; color: #c07030; cursor: pointer; font-size: 20px; padding: 0; }
.del-p:hover { color: #cc2200; }

.btn-gold {
  background: linear-gradient(145deg,#a06800,var(--gold-light),#a06800);
  border: none; color: #fff; padding: 10px 22px; border-radius: 8px;
  font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px;
  letter-spacing: 2px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(160,100,0,.3); transition: all .2s; white-space: nowrap;
}
.btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(160,100,0,.45); }
.btn-ghost {
  background: rgba(255,250,240,.85); border: 1px solid #c8920a88;
  color: #8B5000; padding: 10px 20px; border-radius: 8px;
  font-family: 'Cinzel', serif; font-size: 11px;
  letter-spacing: 2px; cursor: pointer; transition: all .2s; white-space: nowrap;
}
.btn-ghost:hover { background: rgba(200,146,10,.12); border-color: var(--gold); }
.btn-red {
  background: linear-gradient(145deg,var(--red),var(--red-mid),var(--red));
  border: none; color: #fff; padding: 10px 22px; border-radius: 8px;
  font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px;
  letter-spacing: 2px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(160,40,0,.3); transition: all .2s; white-space: nowrap;
}
.btn-red:hover { transform: translateY(-2px); }
.start-btn {
  display: block; width: 100%; margin-top: 4px;
  background: linear-gradient(145deg,#8B4800,#d4820a,#8B4800);
  border: none; color: #fff; padding: 16px; border-radius: 10px;
  font-family: 'Cinzel Decorative', serif; font-size: 16px;
  letter-spacing: 4px; cursor: pointer;
  box-shadow: 0 6px 26px rgba(140,80,0,.35); transition: all .25s;
  position: relative; overflow: hidden;
}
.start-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transform: translateX(-100%); transition: transform .5s;
}
.start-btn:hover::before { transform: translateX(100%); }
.start-btn:hover { transform: translateY(-2px); }

/* ─── PLAY SCREEN ─── */
#play-screen {
  display: none; position: fixed; inset: 0;
  flex-direction: column;
  background: var(--cream);
  background-image:
    radial-gradient(ellipse at 20% 10%, #ffe8a0 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, #f0d49a 0%, transparent 50%);
  overflow: hidden;
}
#play-screen.active { display: flex; }

/* ── Play top strip ── */
#play-top {
  flex-shrink: 0;
  display: flex; align-items: center;
  gap: 8px;
  padding: 5px 10px 4px;
  background: linear-gradient(180deg, rgba(200,146,10,.12) 0%, transparent 100%);
  border-bottom: 1px solid rgba(200,146,10,.25);
}
#play-logo {
  height: clamp(28px,4.5vh,56px);
  width: auto; object-fit: contain;
  mix-blend-mode: multiply;
  filter: drop-shadow(0 2px 5px rgba(120,60,0,.25));
  animation: floatY 3s ease-in-out infinite;
  flex-shrink: 0;
}
#play-title-wrap { flex-shrink: 0; line-height: 1.15; }
#play-title-wrap .t1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(9px,1.6vw,18px);
  letter-spacing: 3px; color: var(--brown-mid);
}
#play-title-wrap .t2 {
  font-size: clamp(7px,1vw,11px);
  letter-spacing: 3px; color: #a07040;
}

/* pips */
#pips-wrap {
  display: flex; flex-wrap: wrap; gap: 5px;
  flex: 1; overflow: hidden;
}
.pip {
  padding: 4px 12px; border-radius: 20px;
  font-size: 11px; letter-spacing: 1px;
  border: 1px solid #cc220066; color: #cc2200;
  background: rgba(200,30,0,.07);
  transition: all .25s; white-space: nowrap;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.pip:hover { background: rgba(200,30,0,.14); border-color: #cc2200; }
.pip.active {
  background: linear-gradient(145deg,#a06800,var(--gold-light));
  border-color: var(--gold); color: #fff; font-weight: bold;
  cursor: default; box-shadow: 0 2px 10px rgba(160,100,0,.4);
}
.pip.done {
  background: rgba(160,20,0,.12); color: var(--red);
  border: 1px solid #aa220088; opacity: .75; cursor: pointer;
}
.pip.done:hover { opacity: 1; background: rgba(160,20,0,.22); border-color: #cc2200; }

#setup-btn { font-size: 10px; padding: 5px 10px; flex-shrink: 0; }

/* ── Turn bar ── */
#turn-bar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 5px 12px;
  background: linear-gradient(160deg,var(--parchment),var(--cream2));
  border-bottom: 2px solid var(--gold);
  box-shadow: 0 3px 12px rgba(120,60,0,.1);
}
#turn-bar .lbl { font-family:'Cinzel Decorative',serif; font-size: clamp(9px,1.5vw,15px); letter-spacing:1px; color:#a07040; }
#turn-bar .name { font-family:'Cinzel Decorative',serif; font-size: clamp(9px,1.5vw,15px); color: var(--brown-mid); font-weight:700; }
#turn-bar .draws { font-size: clamp(9px,1.5vw,15px); color:#b08040; letter-spacing:1px; }
#turn-bar .hint { font-size: clamp(8px,1.2vw,13px); color:#a07040; margin-left:auto; white-space:nowrap; }

/* ── Cards grid ── */
#cards-grid {
  flex: 1; min-height: 0;
  display: flex; flex-wrap: wrap;
  justify-content: center; align-content: center;
  gap: var(--gap, 7px);
  padding: 4px 8px;
  overflow: hidden;
}

/* THE KEY FIX: aspect-ratio:2/3 baked in */
.cw {
  position: relative;
  width: var(--cw, 90px);
  aspect-ratio: 2 / 3;
  perspective: 900px;
  cursor: pointer;
  flex-shrink: 0;
  animation: cDrop .35s ease-out both;
  user-select: none; -webkit-user-select: none;
}
@keyframes cDrop {
  from { opacity:0; transform:translateY(24px) scale(.82) rotate(-4deg); }
  to   { opacity:1; transform:translateY(0) scale(1) rotate(0); }
}
.ci {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transition: transform .05s linear;
}
.cw.flipped .ci {
  transform: rotateY(180deg) !important;
  transition: transform .6s cubic-bezier(.2,.8,.3,1.2) !important;
}
.cw:not(.flipped):not(.disabled):hover .ci {
  transform: rotateY(9deg) translateY(-4px);
  transition: transform .28s ease;
}
.cw.flipped { cursor: default; }
.cw.disabled:not(.flipped) { opacity: .32; cursor: not-allowed; }

/* Card face base */
.cf {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 10px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; overflow: hidden;
}
/* BACK */
.cb {
  background: linear-gradient(160deg,#fff,#f5f0e8);
  border: 2px solid var(--gold);
  box-shadow: 0 4px 14px rgba(0,0,0,.1), inset 0 1px 0 rgba(255,255,255,.9);
}
.cb::before {
  content: ''; position: absolute; inset: 5px;
  border: 1px solid rgba(200,146,10,.3); border-radius: 6px; pointer-events: none;
}
.cb-num {
  font-family: 'Cinzel Decorative', serif;
  font-size: calc(var(--cw,90px) * 0.46);
  font-weight: 700; color: var(--gold);
  text-shadow: 2px 3px 0 rgba(120,60,0,.2);
  line-height: 1; position: relative; z-index: 1;
}
.cb-lbl {
  font-size: calc(var(--cw,90px) * 0.07);
  letter-spacing: 3px; color: #c8a050; margin-top: 4px;
  font-family: 'Cinzel', serif; position: relative; z-index: 1;
}
.cb .tl { position:absolute;top:5px;left:7px; font-family:'Cinzel Decorative',serif; font-size:calc(var(--cw,90px)*.10); color:var(--gold); opacity:.5; }
.cb .br { position:absolute;bottom:5px;right:7px; font-family:'Cinzel Decorative',serif; font-size:calc(var(--cw,90px)*.10); color:var(--gold); opacity:.5; transform:rotate(180deg); }

/* FRONT */
.cfr {
  transform: rotateY(180deg);
  border: 2px solid var(--accent-border,var(--gold));
  background: linear-gradient(160deg,#fff,#faf6ee);
  box-shadow: 0 4px 14px rgba(0,0,0,.1), inset 0 1px 0 rgba(255,255,255,.9);
}
.cfr::before {
  content: ''; position: absolute; inset: 4px;
  border: 1px solid var(--accent-border,var(--gold));
  border-radius: 6px; pointer-events: none; opacity: .35;
}
.cfr.decoy { background: linear-gradient(160deg,#fff8f5,#fff0e8); border-color: #cc4400; }
.cfr.decoy::before { border-color: #cc4400; opacity: .28; }

.cf-n { position:absolute;top:5px;left:7px; font-family:'Cinzel Decorative',serif; font-size:calc(var(--cw,90px)*.10); color:var(--accent-color,var(--gold-dark)); opacity:.6; }
.cf-m {
  font-family: 'Cinzel', serif;
  font-size: calc(var(--cw,90px) * .125);
  font-weight: 700; text-align: center; color: #2a1400;
  line-height: 1.3; padding: 0 6px; letter-spacing: .2px;
}
.cf-m.sm { font-size: calc(var(--cw,90px) * .105); }
.cf-m.xs { font-size: calc(var(--cw,90px) * .088); }
.cf-m.dt  { color: var(--red); }

/* flash */
.cflash {
  position: absolute; inset: 0; border-radius: 10px; pointer-events: none; z-index: 30;
  background: radial-gradient(circle,rgba(255,220,100,.85) 0%,transparent 70%);
  opacity: 0;
}
.cw.flashing .cflash { animation: flashAnim .5s ease-out forwards; }
@keyframes flashAnim {
  0%  { opacity:.85; transform:scale(.5); }
  60% { opacity:.45; transform:scale(1.1); }
  100%{ opacity:0;   transform:scale(1.3); }
}

/* view-mode */
.cards-grid-vm .cw.flipped .cfr { background: linear-gradient(160deg,#fff,#f8f8f8) !important; border-color:var(--gold) !important; }
.cards-grid-vm .cw.flipped .cfr.decoy { background: linear-gradient(160deg,#fff8f5,#fff0e8) !important; border-color:#cc4400 !important; }
.cards-grid-vm .cw:not(.flipped) .cb { background: linear-gradient(160deg,#ccc,#bbb) !important; border-color:#999 !important; box-shadow:none; }
.cards-grid-vm .cw:not(.flipped) .cb-num,
.cards-grid-vm .cw:not(.flipped) .cb-lbl,
.cards-grid-vm .cw:not(.flipped) .tl,
.cards-grid-vm .cw:not(.flipped) .br { color:#999 !important; text-shadow:none !important; }
.cards-grid-vm .cw:not(.flipped) { opacity:1 !important; cursor:default !important; }
.cards-grid-vm .cw:not(.flipped) .cb::before { border-color:rgba(100,100,100,.2) !important; }

/* ── Result banner ── */
#result-banner {
  flex-shrink: 0; display: none;
  background: linear-gradient(145deg,rgba(200,146,10,.15),rgba(200,146,10,.05));
  border-top: 2px solid var(--gold); border-bottom: 1px solid rgba(200,146,10,.3);
  padding: 7px 14px; text-align: center;
}
#result-banner p { font-family:'Cinzel Decorative',serif; font-size:clamp(10px,1.4vw,13px); letter-spacing:2px; color:var(--brown-mid); }

/* ── Action bar ── */
#action-bar {
  flex-shrink: 0;
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  padding: 6px 10px 42px;
  background: linear-gradient(0deg, rgba(200,146,10,.08) 0%, transparent 100%);
  border-top: 1px solid rgba(200,146,10,.2);
}

/* ─── OVERLAY (full-screen card reveal) ─── */
#overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(30,10,0,.78); backdrop-filter: blur(5px);
  align-items: center; justify-content: center;
  gap: clamp(16px,4vw,44px); flex-wrap: wrap;
}
#overlay.active { display: flex; }

#ov-card {
  position: relative;
  width: clamp(120px,30vw,230px);
  aspect-ratio: 2 / 3;
  perspective: 1200px;
  flex-shrink: 0;
  user-select: none; -webkit-user-select: none;
  animation: ovPop .35s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes ovPop { from{transform:scale(.35) translateY(60px);opacity:0} to{transform:scale(1);opacity:1} }

#ov-inner {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transform: rotateY(0deg); transition: none;
}
#ov-inner.snap { transform:rotateY(180deg)!important; transition:transform .6s cubic-bezier(.2,.8,.3,1.2)!important; }

#ov-card .cf { border-radius: 16px; }
#ov-card .cb { border-radius: 16px; }
#ov-card .cfr { border-radius: 16px; }
#ov-card .cb-num { font-size: clamp(48px,13vw,100px); }
#ov-card .cb-lbl { font-size: clamp(9px,1.8vw,13px); letter-spacing: 4px; }
#ov-card .tl, #ov-card .br { font-size: clamp(12px,2.5vw,20px); }
#ov-card .cf-n { font-size: clamp(11px,2.2vw,18px); }
#ov-card .cf-m { font-size: clamp(13px,3.8vw,28px); }
#ov-card .cf-m.sm { font-size: clamp(11px,3vw,22px); }
#ov-card .cf-m.xs { font-size: clamp(10px,2.6vw,18px); }

#ov-flash {
  position: absolute; inset: 0; border-radius: 16px; pointer-events: none; z-index: 10;
  background: radial-gradient(circle,rgba(255,220,100,.9) 0%,transparent 65%);
  opacity: 0;
}
#ov-card.flash-anim #ov-flash { animation: flashAnim .55s ease-out forwards; }

#drag-hint {
  position: absolute; bottom: -46px; left: 50%; transform: translateX(-50%);
  color: rgba(255,220,100,.85); font-size: 12px; letter-spacing: 2px;
  font-family: 'Cinzel', serif; text-align: center; pointer-events: none;
  animation: hintBob .9s ease-in-out infinite alternate;
}
@keyframes hintBob { from{transform:translateX(-50%) translateY(0)} to{transform:translateX(-50%) translateY(-6px)} }

#ov-actions {
  display: none; flex-direction: column; gap: 14px; align-items: center;
}
#ov-actions.active { display: flex; animation: splashPop .4s cubic-bezier(.2,1.3,.4,1) both; }
#ov-actions button {
  width: clamp(125px,35vw,155px);
  padding: clamp(10px,2vh,14px) 20px;
  border: none; border-radius: 10px;
  font-family: 'Cinzel', serif; font-weight: 700;
  font-size: clamp(12px,3vw,14px); letter-spacing: 2px;
  cursor: pointer; transition: transform .15s, box-shadow .15s;
  -webkit-tap-highlight-color: transparent;
}
#ov-actions button:active { transform: scale(.96); }
#btn-confirm { background: linear-gradient(145deg,#a06800,var(--gold-light)); color:#fff; box-shadow:0 5px 18px rgba(160,100,0,.5); }
#btn-reroll  { background: linear-gradient(145deg,#6a006a,#b020b0); color:#fff; box-shadow:0 5px 18px rgba(120,0,120,.45); }

/* ─── REWARD SPLASH ─── */
#splash {
  display: none; position: fixed; inset: 0; z-index: 350;
  align-items: center; justify-content: center; pointer-events: none;
  background: rgba(20,5,0,0); transition: background .3s;
}
#splash.active { display:flex; background:rgba(20,5,0,.5); pointer-events:all; cursor:pointer; }
#splash.active::after {
  content:'แตะเพื่อปิด'; position:absolute; bottom:clamp(55px,9vh,90px);
  left:50%; transform:translateX(-50%);
  font-family:'Cinzel',serif; font-size:clamp(10px,1.8vw,14px);
  letter-spacing:3px; color:rgba(255,220,120,.7); pointer-events:none;
  animation:hintBob .9s ease-in-out infinite alternate;
}
#splash-inner {
  text-align: center;
  background: rgba(0,0,0,.58);
  border: 2px solid rgba(255,200,80,.4); border-radius: 24px;
  padding: clamp(18px,3vw,44px) clamp(22px,5vw,64px);
  backdrop-filter: blur(6px);
  box-shadow: 0 8px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
  animation: splashPop .55s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes splashPop { 0%{opacity:0;transform:scale(.3) translateY(40px)} 70%{opacity:1;transform:scale(1.08) translateY(-6px)} 100%{opacity:1;transform:scale(1)} }
.s-lbl { font-family:'Cinzel',serif; font-size:clamp(11px,2vw,17px); letter-spacing:6px; color:rgba(255,220,120,.9); text-shadow:0 1px 8px rgba(0,0,0,.8); margin-bottom:12px; }

@keyframes splashGlow {

#bonus-toast.show { animation:toastPop .8s cubic-bezier(.2,1.4,.4,1) forwards,toastFade .4s ease-in 1.4s forwards; }
@keyframes toastPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes toastFade{from{opacity:1}to{opacity:0}}

/* ─── NEWS TICKER ─── */

  position:fixed;bottom:0;left:0;right:0;z-index:300;height:36px;

@keyframes tickScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti { display:inline-flex;align-items:center;gap:7px;padding:0 28px; font-family:'Cinzel',serif;font-size:13px;letter-spacing:1px;color:#fde68a; }
.ti-team { color:#fbbf24;font-weight:700; }

/* ─── FULLSCREEN BTN ─── */
#fs-btn {

/* ─── CONFETTI ─── */

#cc-box {

#cc-box p{font-family:'Cinzel',serif;font-size:clamp(13px,3vw,16px);color:#5a2a00;line-height:1.6;margin-bottom:6px;}
#cc-box small{font-family:'Georgia',serif;font-size:12px;color:#a07040;display:block;margin-bottom:20px;}

}

<body>

<canvas id="confetti"></canvas>
<div id="splash">
  <div id="splash-inner">
    <div class="s-lbl">✦ &nbsp; รางวัลของคุณ &nbsp; ✦</div>
    <div class="s-txt" id="splash-text"></div>
  </div>
</div>
<div id="ticker"><div id="tick-track"></div></div>

<!-- ════ SETUP ════ -->
<div id="setup-screen">
<div class="scroll-wrap">
  <div class="s-header">

<script>
/* ═══════════════════════════════
   STATE
═══════════════════════════════ */
let allItems=[], decoyItems=[], players=[], results=[];
let currentTurn=0, viewingTurn=-1;
let deck=[], flipped=[], flippedCnt=0, maxFlips=0;
let currentScreen='setup';
let newDB=1; // new decoy bonus
const SK='scz2_v3';

/* ═══════════════════════════════
   PERSIST
═══════════════════════════════ */
function save(){
  try{ localStorage.setItem(SK,JSON.stringify({allItems,decoyItems,players,results,currentTurn,viewingTurn,deck,flipped,flippedCnt,maxFlips,currentScreen,newDB})); }catch(e){}
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(SK)||'null');
    if(!s)return false;
    allItems=s.allItems||[]; decoyItems=s.decoyItems||[]; players=s.players||[];
    results=s.results||[]; currentTurn=s.currentTurn||0; viewingTurn=s.viewingTurn??-1;
    deck=s.deck||[]; flipped=s.flipped||[]; flippedCnt=s.flippedCnt||0; maxFlips=s.maxFlips||0;
    currentScreen=s.currentScreen||'setup'; newDB=s.newDB||1;
    return true;
  }catch(e){return false;}
}

function showScreen(n){
  currentScreen=n;
  document.getElementById('setup-screen').style.display   = n==='setup'   ?'block':'none';
  document.getElementById('play-screen').classList.toggle('active', n==='play');
  document.getElementById('summary-screen').style.display = n==='summary' ?'block':'none';
  save();
}

/* ═══════════════════════════════
   AUDIO
═══════════════════════════════ */
let actx=null;
function tone(f=440,d=.25,t="triangle",v=.22){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    o.type=t; o.frequency.setValueAtTime(f,actx.currentTime);
    g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
    o.start(); o.stop(actx.currentTime+d);
  }catch(e){}
}
const playShuffle=()=>[200,180,160,200].forEach((f,i)=>setTimeout(()=>tone(f,.1,'sawtooth',.18),i*70));
const playReveal =()=>[330,415,523,659].forEach((f,i)=>setTimeout(()=>tone(f,.2,'sine',.2),i*55));
const playDecoy  =()=>[220,196].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sawtooth',.18),i*120));
const playWin    =()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sine',.22),i*100));

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ═══════════════════════════════
   SETUP — ITEMS
═══════════════════════════════ */
function renderItems(){
  document.getElementById('tags-container').innerHTML =
    allItems.map((it,i)=>`<div class="tag">${esc(it)}<button class="del" onclick="removeItem(${i})">×</button></div>`).join('');
  document.getElementById('item-count').textContent=allItems.length; save();
}
function addItem(){
  const el=document.getElementById('new-item'); const v=el.value.trim();
  if(!v)return; allItems.push(v); el.value=''; renderItems();
}
function removeItem(i){allItems.splice(i,1);renderItems();}
document.getElementById('new-item').addEventListener('keydown',e=>{if(e.key==='Enter')addItem();});

/* ═══════════════════════════════
   SETUP — DECOYS
═══════════════════════════════ */
function changeDB(d){newDB=Math.max(1,newDB+d);document.getElementById('new-decoy-bonus').textContent=newDB;}
function renderDecoys(){
  document.getElementById('decoy-tags').innerHTML =
    decoyItems.map((it,i)=>`<div class="tag dt">${esc(it.text)}<span style="font-size:10px;background:rgba(180,40,0,.15);border-radius:10px;padding:1px 7px;margin-left:2px;color:#8B1a00">+${it.bonus}</span><button class="del" onclick="removeDecoy(${i})">×</button></div>`).join('');
  document.getElementById('decoy-count').textContent=decoyItems.length; save();
}
function addDecoy(){
  const el=document.getElementById('new-decoy'); const v=el.value.trim();
  if(!v)return; decoyItems.push({text:v,bonus:newDB}); el.value=''; renderDecoys();
}
function removeDecoy(i){decoyItems.splice(i,1);renderDecoys();}
document.getElementById('new-decoy').addEventListener('keydown',e=>{if(e.key==='Enter')addDecoy();});

/* ═══════════════════════════════
   SETUP — PLAYERS
═══════════════════════════════ */
function renderPlayers(){
  document.getElementById('players-list').innerHTML=players.map((p,i)=>`
    <div class="player-row">
      <span class="p-num">${i+1}</span>
      <input class="p-name" value="${esc(p.name)}" oninput="players[${i}].name=this.value;save()" placeholder="ชื่อผู้เล่น / ฝ่าย"/>
      <div class="draws-ctrl">
        <span class="draws-lbl">สิทธิ์</span>
        <button class="mini-btn" onclick="chDraws(${i},-1)">−</button>
        <span class="draws-num" id="pd-${i}">${p.draws}</span>
        <button class="mini-btn" onclick="chDraws(${i},1)">+</button>
      </div>
      <button class="del-p" onclick="removePlayer(${i})">×</button>
    </div>`).join(''); save();
}
function addPlayer(){players.push({name:`ฝ่ายที่ ${players.length+1}`,draws:3});renderPlayers();}
function removePlayer(i){players.splice(i,1);renderPlayers();}
function chDraws(i,d){players[i].draws=Math.max(1,players[i].draws+d);document.getElementById(`pd-${i}`).textContent=players[i].draws;save();}

/* ═══════════════════════════════
   CUSTOM CONFIRM
═══════════════════════════════ */
function customConfirm(msg,sub,onYes){
  document.getElementById('cc-msg').textContent=msg;
  document.getElementById('cc-sub').textContent=sub||'';
  document.getElementById('custom-confirm').classList.add('active');
  const box=document.getElementById('custom-confirm');
  const y=document.getElementById('cc-yes'), n=document.getElementById('cc-no');
  const close=()=>{box.classList.remove('active');y.onclick=null;n.onclick=null;};
  y.onclick=()=>{close();onYes();}; n.onclick=close;
  box.onclick=e=>{if(e.target===box)close();};
}

/* ═══════════════════════════════
   FULLSCREEN
═══════════════════════════════ */
function toggleFS(){
  const el=document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen).call(el);
    document.getElementById('fs-btn').textContent='✕';
  }else{
    (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen).call(document);
    document.getElementById('fs-btn').textContent='⛶';
  }
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.getElementById('fs-btn').textContent='⛶';});

/* ═══════════════════════════════
   CARD SIZING  ← แก้ไขหลัก
   ใช้ aspect-ratio:2/3 ใน CSS
   JS แค่คำนวณ --cw ที่เหมาะสม
═══════════════════════════════ */
function computeCardWidth(count){
  // วัดพื้นที่ grid จริง
  const grid = document.getElementById('cards-grid');
  const gw = grid.clientWidth  || window.innerWidth  - 20;
  let   gh = grid.clientHeight;

  // ถ้า grid ยังไม่ได้ layout (height=0) ให้คำนวณเอง
  if(gh < 80){
    const top    = document.getElementById('play-top')?.offsetHeight    || 50;
    const tbar   = document.getElementById('turn-bar')?.offsetHeight    || 36;
    const abar   = document.getElementById('action-bar')?.offsetHeight  || 52;
    const ticker = 36;
    gh = window.innerHeight - top - tbar - abar - ticker - 10;
  }
  gh = Math.max(gh, 100);

  const GAP   = 6;   // ตรงกับ CSS gap
  const RATIO = 1.5; // สัดส่วน h/w = 3/2
  let best = 30;

  for(let cols=1; cols<=count; cols++){
    const rows = Math.ceil(count/cols);
    const cw_w = Math.floor((gw - (cols-1)*GAP) / cols);
    const ch_m = Math.floor((gh - (rows-1)*GAP) / rows);
    const cw_h = Math.floor(ch_m / RATIO);
    const fit  = Math.min(cw_w, cw_h);
    if(fit > best) best = fit;
  }

  // จำกัดสูงสุดตามขนาดจอ
  const maxW = Math.min(Math.floor(gw / Math.max(1, Math.ceil(count / Math.ceil(count * GAP / gw)))), 150);
  return Math.min(best, maxW, 150);
}

function applyCardSize(count){
  const w = computeCardWidth(count);
  document.documentElement.style.setProperty('--cw', w + 'px');
  // --gap ปรับตาม card count
  const gap = count > 15 ? 4 : count > 8 ? 5 : 6;
  document.getElementById('cards-grid').style.gap = gap + 'px';
}

/* ═══════════════════════════════
   START GAME
═══════════════════════════════ */
function startGame(){
  if(!allItems.length){alert('กรุณาเพิ่มการ์ดรางวัลก่อนนะ!');return;}
  if(!players.length){alert('กรุณาเพิ่มผู้เล่นก่อนนะ!');return;}
  results = players.map(p=>({name:p.name,draws:p.draws,items:[],_deck:null,_flipped:null,extraFlips:0}));
  currentTurn=0; viewingTurn=-1;
  showScreen('play'); startTurn();
}

/* ═══════════════════════════════
   TURN
═══════════════════════════════ */
function startTurn(){
  viewingTurn=-1;
  const p = players[currentTurn];
  maxFlips = p.draws;
  const rc = allItems.map(t=>({text:t,isDecoy:false,bonus:0}));
  const dc = decoyItems.map(d=>({text:d.text,isDecoy:true,bonus:d.bonus}));
  deck = [...rc,...dc].sort(()=>Math.random()-.5);
  flipped = new Array(deck.length).fill(false); flippedCnt=0;
  playShuffle();
  document.getElementById('turn-name').textContent = p.name;
  hideActionBtns();
  document.getElementById('result-banner').style.display='none';
  document.getElementById('cards-grid').classList.remove('cards-grid-vm');
  renderPips(); renderCards();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    applyCardSize(deck.length); updateHint(); setTimeout(attachEvents,80); save();
  }));
}

function renderPips(){
  document.getElementById('pips-wrap').innerHTML = players.map((p,i)=>{
    const isLive    = i===currentTurn && viewingTurn===-1;
    const isViewing = i===viewingTurn;
    const played    = !!(results[i]?._deck?.length);
    if(isLive||isViewing) return `<div class="pip active">${esc(p.name)}</div>`;
    if(played)            return `<div class="pip done" onclick="jumpTo(${i})">${esc(p.name)} ↺</div>`;
    return `<div class="pip" onclick="jumpTo(${i})">${esc(p.name)}</div>`;
  }).join('');
}

function hideActionBtns(){
  ['btn-reveal-all','btn-redraw','btn-next'].forEach(id=>document.getElementById(id).style.display='none');
}

function showViewTurn(i){
  viewingTurn=i;
  const r=results[i];
  deck    = [...r._deck];
  flipped = r._flipped ? [...r._flipped] : new Array(deck.length).fill(false);
  flippedCnt = flipped.filter(Boolean).length;
  maxFlips = players[i].draws + (r.extraFlips||0);
  document.getElementById('turn-name').textContent = players[i].name;
  document.getElementById('cards-grid').classList.remove('cards-grid-vm');
  renderPips(); renderCards();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    applyCardSize(deck.length);
    deck.forEach((_,j)=>{
      const el=document.getElementById(`c-${j}`);if(!el)return;
      el.classList.toggle('flipped',!!flipped[j]);
      el.classList.toggle('disabled',!flipped[j]);
    });
    document.getElementById('cards-grid').classList.add('cards-grid-vm');
  }));
  // banner
  const items=r.items;
  const html=items.length
    ?items.map(it=>`<span style="display:inline-block;margin:2px 3px;padding:3px 12px;border-radius:14px;font-size:12px;background:${it.isDecoy?'rgba(180,40,0,.1)':'rgba(200,146,10,.12)'};border:1px solid ${it.isDecoy?'#cc440088':'#c8920a88'};color:${it.isDecoy?'#8B1a00':'#5a3000'}">${esc(it.text)}${it.isDecoy?' 🎭':' ⭐'}</span>`).join('')
    :'<span style="color:#b08040;font-family:Georgia;font-size:13px">ยังไม่ได้จับ</span>';
  document.getElementById('result-text').innerHTML=`<strong>${esc(players[i].name)}</strong> | ${html}`;
  document.getElementById('result-banner').style.display='block';
  document.getElementById('btn-reveal-all').style.display='none';
  document.getElementById('btn-redraw').style.display='';
  document.getElementById('btn-next').style.display='';
  document.getElementById('btn-next').textContent='← กลับ';
  updateHint();
}

function showLiveTurn(){
  viewingTurn=-1;
  const r=results[currentTurn];
  document.getElementById('turn-name').textContent=players[currentTurn].name;
  document.getElementById('cards-grid').classList.remove('cards-grid-vm');
  renderPips();
  if(r?._deck?.length){
    deck    = [...r._deck];
    flipped = [...(r._flipped||new Array(deck.length).fill(false))];
    flippedCnt = flipped.filter(Boolean).length;
    maxFlips   = players[currentTurn].draws + (r.extraFlips||0);
    renderCards();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      applyCardSize(deck.length);
      deck.forEach((_,j)=>{
        const el=document.getElementById(`c-${j}`);if(!el)return;
        el.classList.toggle('flipped',!!flipped[j]);
        el.classList.toggle('disabled',!flipped[j]);
      });
      document.getElementById('cards-grid').classList.add('cards-grid-vm');
      updateHint();
      const isLast=currentTurn>=players.length-1;
      const rc2=results[currentTurn].items.filter(x=>!x.isDecoy).length;
      const dc2=results[currentTurn].items.filter(x=>x.isDecoy).length;
      let txt=`${players[currentTurn].name} เปิดครบแล้ว!`;
      if(dc2>0)txt+=`  (รางวัล ${rc2} | หลอก ${dc2})`;
      document.getElementById('result-text').textContent=txt;
      document.getElementById('result-banner').style.display='block';
      document.getElementById('btn-reveal-all').style.display='';
      document.getElementById('btn-redraw').style.display='';
      document.getElementById('btn-next').style.display='';
      document.getElementById('btn-next').textContent=isLast?'ดูสรุปผล':'ถัดไป ➜';
    }));
  }else{ startTurn(); }
}

function jumpTo(i){
  if(i===currentTurn&&viewingTurn===-1) return;
  if(i===viewingTurn) return;
  const played=!!(results[i]?._deck?.length);
  if(!played){
    viewingTurn=-1; currentTurn=i;
    if(!results[i]) results[i]={name:players[i].name,draws:players[i].draws,items:[],_deck:null,_flipped:null,extraFlips:0};
    hideActionBtns();
    document.getElementById('result-banner').style.display='none';
    startTurn(); return;
  }
  showViewTurn(i);
}

function redrawCurrent(){
  if(splashActive){dismissSplash();return;}
  const t=viewingTurn!==-1?viewingTurn:currentTurn;
  if(t<0||t>=players.length)return;
  customConfirm(`จับใหม่สำหรับ "${players[t].name}"?`,'ผลเดิมจะถูกลบทั้งหมด',()=>{
    results[t]={name:players[t].name,draws:players[t].draws,items:[],_deck:null,_flipped:null,extraFlips:0};
    viewingTurn=-1; currentTurn=t;
    hideActionBtns();
    document.getElementById('result-banner').style.display='none';
    document.getElementById('cards-grid').classList.remove('cards-grid-vm');
    startTurn();
  });
}

function checkTurnDone(){
  if(flippedCnt>=maxFlips){
    if(splashActive){
      const orig=splashCB;
      splashCB=()=>{if(orig)orig();setTimeout(showTurnResult,300);};
    }else{ setTimeout(showTurnResult,450); }
  }
}

function showTurnResult(){
  playWin();
  document.getElementById('cards-grid').classList.add('cards-grid-vm');
  const isLast=currentTurn>=players.length-1;
  const rc2=results[currentTurn].items.filter(x=>!x.isDecoy).length;
  const dc2=results[currentTurn].items.filter(x=>x.isDecoy).length;
  let txt=`${players[currentTurn].name} เปิดครบแล้ว!`;
  if(dc2>0)txt+=`  (รางวัล ${rc2} | หลอก ${dc2})`;
  document.getElementById('result-text').textContent=txt;
  document.getElementById('result-banner').style.display='block';
  document.getElementById('btn-reveal-all').style.display='';
  document.getElementById('btn-redraw').style.display='';
  document.getElementById('btn-next').style.display='';
  document.getElementById('btn-next').textContent=isLast?'ดูสรุปผล':'ถัดไป ➜';
  save();
}

function nextTurn(){
  if(viewingTurn!==-1){showLiveTurn();return;}
  hideActionBtns();
  document.getElementById('result-banner').style.display='none';
  document.getElementById('cards-grid').classList.remove('cards-grid-vm');
  currentTurn++;
  if(currentTurn>=players.length){showSummary();return;}

}

function restoreFlipped(){
  deck.forEach((_,i)=>{
    if(flipped[i]){
      const el=document.getElementById(`c-${i}`);
      if(el){el.classList.add('flipped');el.style.animationDuration='0s';}
    }
  });

    deck.forEach((_,j)=>{
      if(!flipped[j]){const ej=document.getElementById(`c-${j}`);if(ej)ej.classList.add('disabled');}

const cnv=document.getElementById('confetti');
const cctx=cnv.getContext('2d');
let cparts=[],craf=null;
function resizeCnv(){cnv.width=innerWidth;cnv.height=innerHeight;}
window.addEventListener('resize',resizeCnv);resizeCnv();
function launchConfetti(){
  resizeCnv();
  const COLS=['#ffd700','#ff6b6b','#4ecdc4','#45b7d1','#f9ca24','#f0932b','#eb4d4b','#6ab04c','#e056fd','#fff'];
  for(let i=0;i<160;i++){
    const a=Math.random()*Math.PI*2,s=4+Math.random()*10;
    cparts.push({x:innerWidth/2,y:innerHeight*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*8,h:4+Math.random()*6,rot:Math.random()*360,rv:(Math.random()-.5)*10,col:COLS[0|Math.random()*COLS.length],alpha:1,life:1});
  }
  if(!craf)animConf();
}
function animConf(){
  cctx.clearRect(0,0,cnv.width,cnv.height);
  cparts=cparts.filter(p=>p.alpha>.02);
  cparts.forEach(p=>{
    p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;
    p.life-=.012;p.alpha=Math.max(0,p.life);
    cctx.save();cctx.globalAlpha=p.alpha;cctx.translate(p.x,p.y);cctx.rotate(p.rot*Math.PI/180);
    cctx.fillStyle=p.col;cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cctx.restore();
  });
  if(cparts.length>0)craf=requestAnimationFrame(animConf);
  else{craf=null;cctx.clearRect(0,0,cnv.width,cnv.height);}
}

/* ═══════════════════════════════
   DRAG-TO-REVEAL OVERLAY
═══════════════════════════════ */
let ovIdx=-1, dragY0=0, dragX0=0, dragP=0, ovRevealed=false, isDrag=false;

function openOverlay(i){
  if(splashActive)return;
  if(document.getElementById('cards-grid').classList.contains('cards-grid-vm'))return;
  if(flipped[i]||flippedCnt>=maxFlips)return;
  ovIdx=i; ovRevealed=false; dragP=0; isDrag=false;
  const card=deck[i], n=i+1, len=card.text.length;
  const sz=len>20?'xs':len>10?'sm':'';
  document.getElementById('ov-tl').textContent=n;
  document.getElementById('ov-num').textContent=n;
  document.getElementById('ov-br').textContent=n;
  const ab=card.isDecoy?'#cc4400':'#c8920a';
  const ac=card.isDecoy?'#8B1a00':'#8B5E00';
  const front=document.getElementById('ov-front');
  front.style.setProperty('--accent-border',ab);
  front.style.setProperty('--accent-color',ac);
  front.className='cf cfr'+(card.isDecoy?' decoy':'');
  document.getElementById('ov-cf-n').textContent=n;
  const m=document.getElementById('ov-cf-m');
  m.textContent=card.text;
  m.className='cf-m '+sz+(card.isDecoy?' dt':'');
  const inn=document.getElementById('ov-inner');
  inn.classList.remove('snap'); inn.style.transform='rotateY(0deg)'; inn.style.transition='none';
  document.getElementById('drag-hint').style.opacity='1';
  document.getElementById('ov-actions').classList.remove('active');
  document.getElementById('overlay').classList.add('active');
}

function ovMove(cx,cy){
  if(ovRevealed||!isDrag)return;
  const dy=dragY0-cy, dx=cx-dragX0;
  const drag=Math.max(dy,dx*.6);
  dragP=Math.max(0,Math.min(1,drag/110));
  const inn=document.getElementById('ov-inner');
  inn.style.transition='none'; inn.style.transform=`rotateY(${dragP*180}deg)`;
  document.getElementById('drag-hint').style.opacity=String(Math.max(0,1-dragP*2));
  if(dragP>=1)finishReveal();
}

function ovRelease(){
  if(!isDrag)return; isDrag=false;
  if(ovRevealed)return;
  if(dragP>=.52){finishReveal();}
  else{
    const inn=document.getElementById('ov-inner');
    inn.style.transition='transform .35s cubic-bezier(.2,.8,.3,1)';
    inn.style.transform='rotateY(0deg)'; dragP=0;
    document.getElementById('drag-hint').style.opacity='1';
  }
}

function finishReveal(){
  if(ovRevealed)return; ovRevealed=true;
  const inn=document.getElementById('ov-inner');
  inn.classList.add('snap');
  document.getElementById('drag-hint').style.opacity='0';
  deck[ovIdx].isDecoy?playDecoy():playReveal();
  const oc=document.getElementById('ov-card');
  setTimeout(()=>{oc.classList.add('flash-anim');},300);
  setTimeout(()=>{oc.classList.remove('flash-anim');},900);
  setTimeout(()=>{document.getElementById('ov-actions').classList.add('active');},700);
}

function confirmReveal(){
  document.getElementById('ov-actions').classList.remove('active');
  const card=deck[ovIdx];
  const pName=players[currentTurn].name;
  closeOverlay();

  const afterReveal=()=>{
    // บันทึกรางวัล / หลอก
    results[currentTurn].items.push(card);
    if(card.isDecoy){
      maxFlips += card.bonus;
      results[currentTurn].extraFlips = (results[currentTurn].extraFlips||0) + card.bonus;
      showBonusToast(card.bonus);
    }
    flippedCnt++;
    updateHint();

    // บันทึก snapshot ครั้งแรก
    if(flippedCnt===1 && results[currentTurn])
      results[currentTurn]._deck = [...deck];
    results[currentTurn]._flipped = [...flipped]; // ยังไม่ flip ใน deck จริง

    save();

    // ถ้าครบสิทธิ์แล้ว — จบ turn ทันที ไม่ต้อง reshuffle
    if(flippedCnt >= maxFlips){
      checkTurnDone();
      return;
    }

    // ยังเหลือสิทธิ์ — สับใหม่ทั้ง deck ทุกใบปิดหมด
    reshuffleFull();
  };

  if(!card.isDecoy){
    addTick(pName, card.text, false);
    showSplash(card.text, afterReveal);
  }else{
    addTick(pName, card.text, true);
    afterReveal();
  }
}

// สับ deck ใหม่ทั้งหมด — ทุกใบปิด (reset หน้า) สิทธิ์คงเดิม
function reshuffleFull(){
  deck = deck.sort(()=>Math.random()-.5);
  flipped = new Array(deck.length).fill(false);
  playShuffle();
  renderCards();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    applyCardSize(deck.length);
    setTimeout(attachEvents, 80);
  }));
}

function rerollReveal(){
  document.getElementById('ov-actions').classList.remove('active');
  closeOverlay();
  reshuffleFull();
}

function closeOverlay(){document.getElementById('overlay').classList.remove('active');isDrag=false;}

document.getElementById('overlay').addEventListener('mousedown',e=>{
  if(ovRevealed)return;
  if(e.target===document.getElementById('overlay')){closeOverlay();return;}
  isDrag=true; dragY0=e.clientY; dragX0=e.clientX; dragP=0;
});
document.getElementById('overlay').addEventListener('touchstart',e=>{
  if(ovRevealed)return;
  if(e.target===document.getElementById('overlay')){closeOverlay();return;}
  isDrag=true; dragY0=e.touches[0].clientY; dragX0=e.touches[0].clientX; dragP=0;
},{passive:true});
document.addEventListener('mousemove',e=>ovMove(e.clientX,e.clientY));
document.addEventListener('mouseup',ovRelease);
document.addEventListener('touchmove',e=>{if(!isDrag)return;e.preventDefault();ovMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
document.addEventListener('touchend',ovRelease);

function attachEvents(){
  deck.forEach((_,i)=>{
    const el=document.getElementById(`c-${i}`);
    if(!el||flipped[i])return;
    const onDown=e=>{if(flipped[i]||flippedCnt>=maxFlips)return;e.preventDefault();openOverlay(i);};
    el.addEventListener('mousedown',onDown);
    el.addEventListener('touchstart',onDown,{passive:false});
  });
}

function doReveal(i){
  const el=document.getElementById(`c-${i}`);
  if(!el||flipped[i])return;
  flipped[i]=true; flippedCnt++;
  if(flippedCnt===1&&results[currentTurn]) results[currentTurn]._deck=[...deck];
  const card=deck[i];
  results[currentTurn].items.push(card);
  if(card.isDecoy){
    maxFlips+=card.bonus;
    results[currentTurn].extraFlips=(results[currentTurn].extraFlips||0)+card.bonus;
    deck.forEach((_,j)=>{if(!flipped[j]){const ej=document.getElementById(`c-${j}`);if(ej)ej.classList.remove('disabled');}});
    showBonusToast(card.bonus);
  }
  el.classList.add('flipped');
  el.classList.add('flashing');
  setTimeout(()=>el.classList.remove('flashing'),600);
  if(flippedCnt>=maxFlips){
    deck.forEach((_,j)=>{if(!flipped[j]){const ej=document.getElementById(`c-${j}`);if(ej)ej.classList.add('disabled');}});
  }
  updateHint();
  if(results[currentTurn]) results[currentTurn]._flipped=[...flipped];
  save(); checkTurnDone();
}

function revealAll(){
  document.getElementById('btn-reveal-all').style.display='none';
  deck.forEach((_,i)=>{
    if(!flipped[i]){
      setTimeout(()=>{
        const el=document.getElementById(`c-${i}`);if(!el)return;
        el.classList.remove('disabled'); flipped[i]=true; el.classList.add('flipped');
        el.classList.add('flashing'); setTimeout(()=>el.classList.remove('flashing'),600);
      },i*65);
    }
  });
  setTimeout(()=>{
    if(results[currentTurn]){
      if(!results[currentTurn]._deck?.length) results[currentTurn]._deck=[...deck];
      results[currentTurn]._flipped=new Array(deck.length).fill(true);
    }
    document.getElementById('cards-grid').classList.add('cards-grid-vm');
    save();
  },deck.length*65+300);
}

function updateHint(){
  document.getElementById('turn-draws').textContent=`  สิทธิ์ ${flippedCnt}/${maxFlips}`;
  document.getElementById('turn-hint').textContent=flippedCnt>=maxFlips?'✨ เปิดครบแล้ว!':'กดการ์ดแล้วลากขึ้นเพื่อเปิด';
}

function showBonusToast(b){
  const t=document.getElementById('bonus-toast');
  t.textContent=`+${b} สิทธิ์!`; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

    renderPips(); renderCards();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      applyCardSize(deck.length); restoreFlipped(); updateHint();
      setTimeout(attachEvents,80);
      if(flippedCnt>=maxFlips&&maxFlips>0) showTurnResult();
    }));
  }else if(currentScreen==='summary'){showScreen('summary');showSummary();}
  else showScreen('setup');
}else{
  allItems=["สมบัติทองคำ","แผนที่ลับ","ขวดรัม","นกแก้ว","ปืนคาบศิลา","กระดูกไขว้","เรือใบ","ดาบคัตลาส"];
  decoyItems=[{text:"ยังไม่ใช่นะ!",bonus:1},{text:"โชคไม่ดี เลือกใหม่ 2 ใบ!",bonus:2}];
  players=[{name:'ฝ่ายที่ 1',draws:3},{name:'ฝ่ายที่ 2',draws:2}];
  renderItems(); renderDecoys(); renderPlayers(); showScreen('setup');
}
</script>
